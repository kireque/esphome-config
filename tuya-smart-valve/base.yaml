---
# Device: Tuya smart valve (ESP8266 ESP-12e)
# GPIOs: relay=GPIO13, button=GPIO12

esp8266:
  board: esp12e
  framework:
    version: recommended

packages:
  common: !include ../esphome-common/base.yaml
  wifi: !include ../esphome-common/wifi.yaml

web_server:
  port: 80
  auth:
    type: digest
    username: admin
    password: !secret web_password

switch:
  - platform: gpio
    name: "relay"
    pin: GPIO13
    id: switch_relay
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:water-pump
    on_turn_on:
      - logger.log: "Valve Turned On!"
      - script.execute: valve_auto_off
    on_turn_off:
      - logger.log: "Valve Turned Off!"
      - script.stop: valve_auto_off

# Safety cut-off: close the valve after max runtime, however it was opened
script:
  - id: valve_auto_off
    mode: restart
    then:
      - delay: 30min
      - logger.log: "Valve auto-off after max runtime"
      - switch.turn_off: switch_relay

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO12
      inverted: true
    name: "button"
    on_press:
      - switch.toggle: switch_relay
