---
substitutions:
  uart_id: uart_dsmr
  uart_rx_pin: GPIO16
  dsmr_id: dsmr_instance
  dsmr_request_pin: GPIO12
  gas_mbus_id: "${gas_mbus_id}"
  light_led_blue_id: light_led_blue
  light_led_green_id: light_led_green
  light_led_red_id: light_led_red
  output_led_blue_id: output_led_blue
  output_led_blue_pin: GPIO14
  output_led_green_id: output_led_green
  output_led_green_pin: GPIO13
  output_led_red_id: output_led_red
  output_led_red_pin: GPIO05

# Persistent water meter total (survives reboots and reflashes)
esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(water_pulse_offset) = 0.0;
            id(water_meter_initial).publish_state(id(water_total_persistent));
        - component.update: sensor_water_meter_total
  on_shutdown:
    - priority: -100
      then:
        - lambda: |-
            if (!id(sensor_pulse_meter_total).has_state() || isnan(id(sensor_pulse_meter_total).state)) {
              return;
            }
            float pulses_since_offset = id(sensor_pulse_meter_total).state - id(water_pulse_offset);
            if (pulses_since_offset > 0) {
              id(water_total_persistent) += pulses_since_offset;
              id(water_pulse_offset) = id(sensor_pulse_meter_total).state;
              ESP_LOGI("water", "Water total saved on shutdown: %.3f m³", id(water_total_persistent));
            }

globals:
  - id: water_total_persistent
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: water_pulse_offset
    type: float
    restore_value: false
    initial_value: "0.0"

interval:
  - interval: 5min
    then:
      - lambda: |-
          if (!id(sensor_pulse_meter_total).has_state() || isnan(id(sensor_pulse_meter_total).state)) {
            return;
          }
          float pulses_since_offset = id(sensor_pulse_meter_total).state - id(water_pulse_offset);
          if (pulses_since_offset >= 0.005) {
            id(water_total_persistent) += pulses_since_offset;
            id(water_pulse_offset) = id(sensor_pulse_meter_total).state;
            ESP_LOGI("water", "Water total saved: %.3f m³ (+%.3f m³)", id(water_total_persistent), pulses_since_offset);
          }

number:
  - platform: template
    id: water_meter_initial
    name: "Water Meter Initial Value"
    icon: "mdi:water-plus"
    unit_of_measurement: "m³"
    device_class: water
    entity_category: config
    optimistic: true
    min_value: 0
    max_value: 100000
    step: 0.001
    mode: box
    set_action:
      then:
        - lambda: |-
            id(water_total_persistent) = x;
            if (id(sensor_pulse_meter_total).has_state() && !isnan(id(sensor_pulse_meter_total).state)) {
              id(water_pulse_offset) = id(sensor_pulse_meter_total).state;
            } else {
              id(water_pulse_offset) = 0.0;
            }
            global_preferences->sync();
            ESP_LOGI("water", "Water meter initial value saved: %.3f m³", x);
        - component.update: sensor_water_meter_total

# I²C Bus
i2c:
  sda: GPIO15
  scl: GPIO4
  scan: true
  frequency: 400kHz

# DSMR part
uart:
  - id: ${uart_id}
    rx_pin:
      number: ${uart_rx_pin}
      inverted: true
    baud_rate: 115200
    rx_buffer_size: 1700

dsmr:
  id: ${dsmr_id}
  uart_id: ${uart_id}
  max_telegram_length: 1700
  request_pin: ${dsmr_request_pin}
  gas_mbus_id: ${gas_mbus_id}

#LED for measure status
output:
  - platform: ledc
    pin: ${output_led_green_pin}
    id: ${output_led_green_id}
  - platform: ledc
    pin: ${output_led_red_pin}
    id: ${output_led_red_id}
  - platform: ledc
    pin: ${output_led_blue_pin}
    id: ${output_led_blue_id}

light:
  - platform: monochromatic
    id: ${light_led_blue_id}
    output: ${output_led_blue_id}
  - platform: monochromatic
    id: ${light_led_green_id}
    output: ${output_led_green_id}
  - platform: status_led
    id: ${light_led_red_id}
    output: ${output_led_red_id}

binary_sensor:
  - platform: gpio
    id: water_leak_sensor
    name: "Water Leak Sensor"
    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
      inverted: true
    device_class: moisture
    filters:
      - delayed_on: 100ms
      - delayed_off: 2s

# Sensors (single-phase meter: no L2/L3, no voltage reported)
sensor:
  - platform: dsmr
    energy_delivered_tariff1:
      id: dsmr_electricity_delivered_1
      name: "Energy Consumed Tariff 1"
      state_class: total_increasing
    energy_returned_tariff1:
      id: dsmr_electricity_returned_1
      name: "Energy Produced Tariff 1"
      state_class: total_increasing
    energy_delivered_tariff2:
      id: dsmr_electricity_delivered_2
      name: "Energy Consumed Tariff 2"
      state_class: total_increasing
    energy_returned_tariff2:
      id: dsmr_electricity_returned_2
      name: "Energy Produced Tariff 2"
      state_class: total_increasing
    power_delivered:
      accuracy_decimals: 3
      id: dsmr_electricity_currently_delivered
      name: "Power Consumed"
    power_returned:
      accuracy_decimals: 3
      id: dsmr_electricity_currently_returned
      name: "Power Produced"
    current_l1:
      id: dsmr_phase_power_current_l1
      name: "Current Phase 1"
    power_delivered_l1:
      accuracy_decimals: 3
      id: dsmr_phase_currently_delivered_l1
      name: "Power Consumed Phase 1"
    power_returned_l1:
      accuracy_decimals: 3
      id: dsmr_phase_currently_returned_l1
      name: "Power Produced Phase 1"
    gas_delivered:
      id: dsmr_extra_device_delivered
      name: "Gas Consumed"
      state_class: total_increasing
    electricity_failures:
      id: dsmr_electricity_failures
      name: "Electricity Failures"
      icon: "mdi:flash-alert"
    electricity_long_failures:
      id: dsmr_electricity_long_failures
      name: "Electricity Long Failures"
      icon: "mdi:flash-alert-outline"
    electricity_sags_l1:
      id: dsmr_electricity_sags_l1
      name: "Voltage Sags Phase 1"
      icon: "mdi:sine-wave"
    electricity_swells_l1:
      id: dsmr_electricity_swells_l1
      name: "Voltage Swells Phase 1"
      icon: "mdi:sine-wave"
  - platform: copy
    source_id: dsmr_electricity_currently_delivered
    id: dsmr_electricity_currently_delivered_watt
    name: Power Consumed (W)
    accuracy_decimals: 0
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    filters:
      - multiply: 1000
  - platform: copy
    source_id: dsmr_electricity_currently_returned
    id: dsmr_electricity_currently_returned_watt
    name: Power Produced (W)
    accuracy_decimals: 0
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    filters:
      - multiply: 1000

  #WaterMeter sensor part
  - platform: pulse_meter
    id: sensor_pulse_meter
    name: "Water Current Usage"
    icon: "mdi:water-pump"
    unit_of_measurement: "L/min"
    device_class: volume_flow_rate
    state_class: measurement
    internal_filter_mode: PULSE
    internal_filter: 200ms
    timeout: 2min
    accuracy_decimals: 1
    total:
      id: sensor_pulse_meter_total
      name: "Water Total Consumption"
      icon: "mdi:cube-outline"
      unit_of_measurement: "m³"
      state_class: total_increasing
      device_class: water
      accuracy_decimals: 3
      filters:
        - multiply: 0.001
    pin: GPIO32
    on_value:
      then:
        - light.turn_on:
            id: ${light_led_green_id}
            flash_length: 1s
        - component.update: sensor_water_meter_total
  - platform: template
    id: sensor_water_meter_total
    name: "Water Meter Total"
    icon: "mdi:water-check"
    unit_of_measurement: "m³"
    state_class: total_increasing
    device_class: water
    accuracy_decimals: 3
    update_interval: 60s
    lambda: |-
      if (!id(sensor_pulse_meter_total).has_state() || isnan(id(sensor_pulse_meter_total).state)) {
        return id(water_total_persistent);
      }
      float current_delta = id(sensor_pulse_meter_total).state - id(water_pulse_offset);
      if (current_delta < 0.0) {
        current_delta = 0.0;
      }
      return id(water_total_persistent) + current_delta;

  #HDC1080 temp & hum sensor
  - platform: hdc1080
    temperature:
      id: sensor_temperature
      name: "Temperature"
      filters:
        offset: -4.5
    humidity:
      id: sensor_humidity
      name: "Humidity"
      filters:
        offset: 12
    update_interval: 60s

text_sensor:
  - platform: dsmr
    identification:
      name: Identification
    p1_version:
      name: Version
    electricity_tariff:
      id: dsmr_electricity_tariff
      name: "Electricity Tariff"
      icon: "mdi:cash-multiple"
    gas_equipment_id:
      id: dsmr_gas_equipment_id
      name: "Gas Equipment ID"
      icon: "mdi:fire"
      disabled_by_default: true
